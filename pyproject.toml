[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "qps-graphics-manager"
description = "Keep one copy of each game's graphics settings per hardware setup (handheld, eGPU dock, ...) and swap between them."
readme = "README.md"
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "PySide6>=6.6",
    "platformdirs>=4.0",
    "psutil>=5.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[project.scripts]
qpgm = "qpgm.cli:main"

[project.gui-scripts]
qpgm-gui = "qpgm.gui.app:main"

[project.urls]
Repository = "https://github.com/QPfixxy/QPs-Graphics-Manager"

[tool.setuptools.dynamic]
version = { attr = "qpgm.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"qpgm.gui" = ["resources/icons/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
